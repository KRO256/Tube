name: build
on:
  push:
  workflow_dispatch:
jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: deps
        run: sudo apt-get update -q && sudo apt-get install -y -q perl git curl build-essential fakeroot xz-utils ca-certificates > /dev/null
      - name: theos
        run: |
          export THEOS=~/theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          git clone --depth 1 https://github.com/theos/sdks.git ~/sdks-tmp
          cp -a ~/sdks-tmp/iPhoneOS12.4.sdk ~/theos/sdks/
          ls ~/theos/toolchain/linux/iphone/bin/clang ~/theos/sdks/iPhoneOS12.4.sdk
      - name: package
        run: |
          export THEOS=~/theos
          make package FINALPACKAGE=1
          ls -la *.deb packages/*.deb 2>/dev/null || true
      - name: verify
        run: |
          DEB=$(ls packages/*.deb *.deb 2>/dev/null | head -1)
          dpkg-deb -c "$DEB"
          python3 .github/verify_deb.py "$DEB"
      - uses: actions/upload-artifact@v4
        with:
          name: tube-deb
          path: |
            *.deb
            packages/*.deb
